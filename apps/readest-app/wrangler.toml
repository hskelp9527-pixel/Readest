name = "readest-airainyu"
main = "worker.ts"
compatibility_date = "2026-04-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[[routes]]
pattern = "readest.airainyu.xyz"
zone_name = "airainyu.xyz"
custom_domain = true

[vars]
PNPM_VERSION = "10.28.1"
# Z-Library 镜像；凭据走 secret：wrangler secret put ZLIB_REMIX_USERID / ZLIB_REMIX_USERKEY
ZLIB_DOMAIN = "tw.zlib0.ru"

[observability]
enabled = true
head_sampling_rate = 0.01
logs = { head_sampling_rate = 0.01 }
traces = { head_sampling_rate = 0.01 }

[assets]
# 静态导出产物（EXPORT_STATIC=true next build）。走 Static Assets 而不是
# OpenNext 的服务端 bundle：后者 gzip 后 6.5 MiB，超过免费版 3 MiB 的代码上限。
directory = "out"
binding = "ASSETS"
not_found_handling = "404-page"

# 上游的 KV / R2 / Analytics Engine 绑定指向 Readest 官方账号的资源，本账号没有。
# 代码里这三个绑定都是可选的（翻译缓存、增量缓存、IAP 埋点），去掉即可正常运行。
